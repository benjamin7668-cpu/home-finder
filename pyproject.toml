[project]
name = "home-finder"
version = "0.1.0"
description = "부부 직장 위치와 예산으로 수도권 내 집 마련 입지를 추천하는 데모"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: 실제 API 호출"]
addopts = "-m 'not live'"
